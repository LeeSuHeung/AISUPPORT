name: Verify AISUPPORT portability

on:
  workflow_dispatch:

jobs:
  portable-install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tracked executable modes
        shell: bash
        run: |
          test "$(git ls-files --stage -- install.sh | cut -d' ' -f1)" = "100755"
          test "$(git ls-files --stage -- scripts/install-aisupport.sh | cut -d' ' -f1)" = "100755"
          while IFS= read -r file; do
            test "$(git ls-files --stage -- "$file" | cut -d' ' -f1)" = "100755"
          done < <(node -e "for (const file of require('./superpowers-manifest.json').executables) console.log(file)")

      - name: Install through POSIX wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/install-aisupport.sh --target "$RUNNER_TEMP/aisupport-skills" --agents-file "$RUNNER_TEMP/codex-home/AGENTS.md"

      - name: Install through PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-aisupport.ps1 -Target "$env:RUNNER_TEMP\aisupport-skills" -AgentsFile "$env:RUNNER_TEMP\codex-home\AGENTS.md"

      - name: Verify installed files
        shell: bash
        run: node scripts/install-aisupport.mjs --target "$RUNNER_TEMP/aisupport-skills" --agents-file "$RUNNER_TEMP/codex-home/AGENTS.md" --verify

      - name: Verify idempotent reinstall
        shell: bash
        run: node scripts/install-aisupport.mjs --target "$RUNNER_TEMP/aisupport-skills" --agents-file "$RUNNER_TEMP/codex-home/AGENTS.md"

      - name: Test preservation and conflict handling
        shell: bash
        run: node scripts/test-caveman-installer.mjs

      - name: Test Gupabal Hooks
        shell: bash
        run: python -B -m unittest discover -s tests -v

      - name: Test integrated POSIX wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/test_install_sh.sh
